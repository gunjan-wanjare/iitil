name: Deploy to Production

on:
  push:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Verify build output
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "Exported output:"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out/

      - name: Verify downloaded files
        run: |
          ls -R out

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy assets (long cache)
        run: |
          aws s3 sync out/_next/ s3://${{ vars.AWS_S3_BUCKET }}/_next/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy HTML files
        run: |
          aws s3 sync out/ s3://${{ vars.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude "_next/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "### Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket:** s3://${{ vars.AWS_S3_BUCKET }}" >> $GITHUB_STEP_SUMMARY
